fileType: momentic/test/v2
id: celularpro-requisitos-clave
description: Validación de credenciales — los requisitos de la contraseña se marcan en vivo y una clave sin mayúscula no se envía
defaultEnv: local
labels: [credenciales, heuristicas, negativo]
steps:
  - navigate: "{{ env.BASE_URL }}/register"
  - type:
      text: medellin2026
      css: "#password"
  - assert: In the password requirements list, lowercase letter and number are marked as met, and uppercase letter is still pending
  - type:
      text: Ana Pérez
      into: Nombre completo input
  - type:
      text: momentic.negativo@gmail.com
      into: Email input
  - type:
      text: medellin2026
      css: "#confirmPassword"
  - click: Crear cuenta gratis button
  - checkPageContains: La contraseña debe incluir al menos una letra mayúscula
  - waitForUrl: /register
