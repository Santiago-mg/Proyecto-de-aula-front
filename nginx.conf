server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # React Router maneja las rutas del lado del cliente. Sin try_files, entrar
    # directo a /catalog o /admin/phones (o recargar estando ahi) devuelve 404,
    # porque en disco no existe ningun archivo con ese nombre: hay que entregar
    # index.html y dejar que el router resuelva.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-Frame-Options        "SAMEORIGIN"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Vite pone un hash en el nombre de cada archivo que genera, asi que el
    # contenido de /assets nunca cambia sin cambiar de nombre: se puede cachear
    # un año sin riesgo de servir una version vieja.
    location /assets/ {
        expires 1y;
        access_log off;

        # Ojo: nginx NO hereda los add_header del bloque padre cuando el bloque
        # hijo declara los suyos, por eso se repiten aqui en vez de dejarlos
        # solo a nivel de server.
        add_header Cache-Control          "public, immutable"              always;
        add_header X-Content-Type-Options "nosniff"                        always;
    }

    # index.html si debe revalidarse en cada visita: es el que apunta a los
    # assets nuevos despues de cada despliegue. Si se cachea, el navegador
    # sigue pidiendo los bundles viejos aunque ya se haya desplegado.
    location = /index.html {
        add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-Frame-Options        "SAMEORIGIN"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}
