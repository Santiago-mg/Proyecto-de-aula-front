sonar.projectKey=CelularPro-Frontend
sonar.projectName=CelularPro Frontend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Solo el codigo de la aplicacion. Sin esto el scanner recorre todo el
# proyecto, incluida dist/ (el bundle compilado y minificado).
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts,test/**/*.test.tsx

sonar.exclusions=dist/**,coverage/**,reports/**,node_modules/**,**/*.css

# Mismas exclusiones que coverage.exclude en vitest.config.ts: el arranque
# de la app y los archivos que solo declaran tipos no tienen codigo ejecutable.
sonar.coverage.exclusions=src/main.tsx,src/types/**,src/vite-env.d.ts

# S6819 sugiere cambiar role="dialog|status|group|region" por <dialog>, <output>,
# <fieldset> o <section>. Se dejan los roles ARIA a proposito: <dialog> exige
# showModal() y trae estilos propios, y los modales ya manejan el foco y Escape
# con useFocusTrap. Es una sugerencia de estilo, no un defecto de accesibilidad.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**

# Cobertura generada con: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# En Jenkins se sobreescribe con el parametro SONAR_HOST_URL.
sonar.host.url=http://localhost:9000
